name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, version and perf record agree
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          [ "$version" = "$declared" ] || { echo "::error::tag $GITHUB_REF_NAME, workspace version $declared"; exit 1; }
          [ -f "perf/history/v$version.json" ] || { echo "::error::perf/history/v$version.json missing"; exit 1; }
  test:
    needs: verify
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: .tmp/release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file .tmp/release-notes.md
          --title "$GITHUB_REF_NAME"
          perf/chart.svg "perf/history/$GITHUB_REF_NAME.json"

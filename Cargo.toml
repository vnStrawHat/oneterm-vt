[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
publish = false
version = "0.1.3"

[workspace.dependencies]
# vt-bench (phase 0)
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
# oneterm-vt, added per phase (see docs/roadmap.md)
bitflags = "2.13"
log = "0.4.34"
memchr = "2.8"
rustc-hash = "2.1"
unicode-segmentation = "1.13.3"
unicode-width = "=0.2.2"           # exact pin: the width table is a compatibility contract; bump deliberately
regex = "1.12"                     # feature `regex`, phase 8
hotpath = "0.26"                   # feature `hotpath-profiling`, phase 12
polling = "3.11"                   # feature `pty`, phase 11 (public dependency)
libc = "0.2.186"                   # feature `pty`, Unix, phase 11
windows-sys = "0.61"               # feature `pty`, Windows; the version polling 3.11 uses
proptest = "1.11"                  # dev-dependency from phase 1

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"

# Build speed and disk: own crates keep line tables only (enough for backtraces, a fraction of
# full debuginfo); dependencies get none and a little optimization so debug runs are not glacial.
[profile.dev]
debug = "line-tables-only"
codegen-units = 16

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

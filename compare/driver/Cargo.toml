[package]
name = "compare-driver"
description = "Runs the cross-engine comparison: corpus, build, verify, golden, run, report."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "compare"
path = "src/main.rs"

[dependencies]
compare-harness = { path = "../harness" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[lints]
workspace = true

[package]
name = "engine-oneterm"
description = "Adapter: oneterm-vt (this repository) for the cross-engine comparison."
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false
build = "build.rs"

# Its own workspace: no feature or version unification with the other engines.
[workspace]

[[bin]]
name = "engine-oneterm"
path = "src/main.rs"

[dependencies]
compare-harness = { path = "../../harness" }
oneterm-vt = { path = "../../../crates/vt", default-features = false }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

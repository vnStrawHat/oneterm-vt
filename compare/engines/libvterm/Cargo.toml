[package]
name = "engine-libvterm"
description = "Adapter: libvterm (neovim mirror at the pinned commit) for the cross-engine comparison."
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false
build = "build.rs"

# Its own workspace: no feature or version unification with the other engines.
[workspace]

[[bin]]
name = "engine-libvterm"
path = "src/main.rs"

[dependencies]
compare-harness = { path = "../../harness" }

[build-dependencies]
cc = "1"

[lints.rust]
# Lifted for this crate only: the engine is C, so every call into it is an FFI call. Each
# `unsafe` block states the invariants it relies on.
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

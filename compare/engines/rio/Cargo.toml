[package]
name = "engine-rio"
description = "Adapter: rio for the cross-engine comparison."
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

# Its own workspace: no feature or version unification with the other engines.
[workspace]

[[bin]]
name = "engine-rio"
path = "src/main.rs"

[dependencies]
compare-harness = { path = "../../harness" }
rio-vt = { version = "=0.5.28", default-features = false }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

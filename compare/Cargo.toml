# Cross-engine comparison (docs/specs/0016-cross-engine-bench). Outside the root workspace and
# CI on purpose: the engines under `engines/` pull in heavy stacks (wezterm, Zig, Node).
[workspace]
resolver = "3"
members = ["harness", "driver"]
exclude = ["engines"]

[workspace.package]
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
toml = "0.8"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[package]
name = "oneterm-vt"
description = "An embeddable terminal core: VT parser, grid with scrollback, reflow, selection, damage-tracked snapshots, Sixel and an optional pseudo-console transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["pty"]
# Pseudo-console transport (ConPTY / openpty). Gains its dependencies in phase 11.
pty = []
# Widens the integrity walk to the whole history wherever the walk runs; for tests, fuzzing and CI only.
vt-paranoid = []
# Regular-expression scrollback search (`search::SearchPattern::Regex`). Off by default: the
# literal matcher needs nothing, and the default dependency set is a promise.
regex = ["dep:regex"]
# `hotpath::measure` sites on hot paths. Gains `dep:hotpath` in phase 12.
hotpath-profiling = []

[dependencies]
bitflags.workspace = true
memchr.workspace = true
# Optional: the `regex` feature's matcher; default features kept (Unicode classes, perf).
regex = { workspace = true, optional = true }
rustc-hash.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

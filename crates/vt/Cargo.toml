[package]
name = "oneterm-vt"
description = "An embeddable terminal core: VT parser, grid with scrollback, reflow, selection, damage-tracked snapshots, Sixel and an optional pseudo-console transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["pty"]
# Pseudo-console transport (ConPTY / openpty), pollable with `polling`.
pty = ["dep:polling", "dep:windows-sys", "dep:libc"]
# Widens the integrity walk to the whole history wherever the walk runs; for tests, fuzzing and CI only.
vt-paranoid = []
# Regular-expression scrollback search (`search::SearchPattern::Regex`). Off by default: the
# literal matcher needs nothing, and the default dependency set is a promise.
regex = ["dep:regex"]
# Function timing sites (`hotpath::measure`) on `feed`, the parser, the scroll primitives and
# `snapshot_update`. Off by default; changes no public item. Alone it compiles hotpath's no-op
# half: a site measures only when the final binary also enables `hotpath/hotpath`.
hotpath-profiling = ["dep:hotpath"]

[dependencies]
bitflags.workspace = true
hotpath = { workspace = true, optional = true }   # feature `hotpath-profiling` only
log.workspace = true            # pty diagnostics; one of the six no-default leaf crates
memchr.workspace = true
# PUBLIC dependency under `pty`: Poller, Event and PollMode appear in EventedReadWrite.
polling = { workspace = true, optional = true }
# Optional: the `regex` feature's matcher; default features kept (Unicode classes, perf).
regex = { workspace = true, optional = true }
rustc-hash.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

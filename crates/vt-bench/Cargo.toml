[package]
name = "oneterm-vt-bench"
description = "Benchmark tiers and the perf-history chart for oneterm-vt. Developer tool, not shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vt-bench"
path = "src/main.rs"

[features]
# Passthroughs: the bench must know how the engine was built (`grid --check` refuses a skewed build).
vt-paranoid = ["oneterm-vt/vt-paranoid"]
hotpath-profiling = ["oneterm-vt/hotpath-profiling", "dep:hotpath", "hotpath/hotpath"]

[dependencies]
oneterm-vt = { path = "../vt" }
anyhow.workspace = true
hotpath = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
